# Ornith-1.5-9B on one RTX 3090, containerized.
#
#   docker compose --profile single up -d     # low latency: MTP speculative decoding
#   docker compose --profile batch  up -d     # throughput
#   docker compose run --rm prepare           # download + requantize Ornith-1.5-9B
#   docker compose run --rm single verify     # verify.sh inside the container
#
# Knobs go in a .env file next to this file: VLLM_API_KEY=...,
# and any of the start-script variables (CTX, KV, MAX_LEN, MAX_SEQS, GPU_UTIL,
# DRAFT_TOKENS, EXTRA_ARGS, ...) — .env is passed straight into the container.
#
# PORT, MODELS_DIR, and NVIDIA_GPU are read here: models live in ./models by
# default (the same layout as the venv install, so both can share one download).
# NVIDIA_GPU is the host GPU index (or UUID) for device_ids; default 0.
# One GPU: run either "single" or "batch", not both.

x-ornith: &ornith
  image: ornith15-9b-rtx3090:latest
  build: .
  pull_policy: missing
  ipc: host
  env_file:
    - path: .env
      required: false
  environment:
    HOME: /cache
    HF_TOKEN: ${HF_TOKEN:-}
    HF_HUB_ENABLE_HF_TRANSFER: ${HF_HUB_ENABLE_HF_TRANSFER:-1}
  volumes:
    - ${MODELS_DIR:-./models}:/app/models
    - ./docker:/app/docker
    - ./single-user:/app/single-user
    - ./batch:/app/batch
    - ./prepare:/app/prepare
    - ./verify.sh:/app/verify.sh
    - ornith-cache:/cache

x-serve: &serve
  <<: *ornith
  ports:
    - "${PORT:-18020}:${PORT:-18020}"
  depends_on:
    prepare:
      condition: service_completed_successfully
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ['${NVIDIA_GPU:-0}']
            capabilities: [gpu]
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:${PORT:-18020}/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 900s   # first start: torch.compile + CUDA graphs + FlashInfer JIT

services:
  prepare:
    <<: *ornith
    command: prepare

  single:
    <<: *serve
    profiles: [single]
    command: single

  batch:
    <<: *serve
    profiles: [batch]
    command: batch

volumes:
  ornith-cache:
