# Ornith-1.5-9B on one RTX 3090, containerized.
#
#   docker compose --profile single up -d     # low latency: MTP speculative decoding (default)
#   SPEC=dflash2 …                           # after models/Ornith-1.5-9B-DFlash2-W4A16 exists
#   docker compose --profile batch  up -d     # throughput
#   docker compose run --rm prepare           # download + requantize Ornith-1.5-9B
#   docker compose run --rm single verify     # verify.sh inside the container
#
# Knobs go in a .env file next to this file: VLLM_API_KEY=...,
# and any of the start-script variables (CTX, KV, MAX_LEN, MAX_SEQS, GPU_UTIL,
# DRAFT_TOKENS, SERVED_MODEL_NAME, SLEEP_LEVEL, EXTRA_ARGS, ...) — .env is passed straight
# into the container.
#
# PORT is the host publish port only. vLLM always listens on 8000 inside the
# container (its own default), so PORT=8002 publishes as 8002:8000 — not
# 8002:8002. Recreate after changing PORT (`docker compose up -d --force-recreate`).
# MODELS_DIR defaults to ./models (same layout as the venv install).
# NVIDIA_GPU is the host GPU index (or UUID) for device_ids; default 0.
# One GPU: run either "single" or "batch", not both.

x-ornith: &ornith
  image: ornith15-9b-rtx3090:latest
  build: .
  pull_policy: missing
  ipc: host
  env_file:
    - path: .env
      required: false
  environment:
    HOME: /cache
    HF_TOKEN: ${HF_TOKEN:-}
    HF_HUB_ENABLE_HF_TRANSFER: ${HF_HUB_ENABLE_HF_TRANSFER:-1}
    # Override .env PORT so the start script binds vLLM on 8000, not the host port.
    PORT: "8000"
  volumes:
    - ${MODELS_DIR:-./models}:/app/models
    - ./docker:/app/docker
    - ./single-user:/app/single-user
    - ./batch:/app/batch
    - ./prepare:/app/prepare
    - ./drafter:/app/drafter
    - ./bench:/app/bench
    - ./verify.sh:/app/verify.sh
    - ornith-cache:/cache

x-serve: &serve
  <<: *ornith
  ports:
    - "${PORT:-18020}:8000"
  depends_on:
    prepare:
      condition: service_completed_successfully
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ['${NVIDIA_GPU:-0}']
            capabilities: [gpu]
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 900s   # first start: torch.compile + CUDA graphs + FlashInfer JIT

services:
  prepare:
    <<: *ornith
    command: prepare

  single:
    <<: *serve
    profiles: [single]
    command: single

  batch:
    <<: *serve
    profiles: [batch]
    command: batch

volumes:
  ornith-cache:
